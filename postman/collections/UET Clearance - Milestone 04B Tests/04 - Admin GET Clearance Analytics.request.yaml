$kind: http-request
url: "{{base_url}}/clearance/analytics"
method: GET
headers:
  Authorization: Bearer {{admin_token}}
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      pm.test('Analytics returned summary & bottlenecks', () => {
          pm.expect(res.success).to.be.true;
          pm.expect(res.data.summary).to.have.property('total_applications');
          pm.expect(res.data.department_bottlenecks.length).to.be.above(0);
      });
    language: text/javascript
order: 4000
