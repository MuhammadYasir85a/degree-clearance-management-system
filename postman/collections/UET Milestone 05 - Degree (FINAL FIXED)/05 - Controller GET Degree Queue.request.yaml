$kind: http-request
url: "{{base_url}}/degree/controller/queue?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{controller_token}}
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      console.log('Queue response status:', pm.response.code);
      if (!res.success) console.log('Queue error:', res.message);
      pm.test('Controller queue fetched', () => {
        pm.expect(res.success).to.be.true;
        pm.expect(res).to.have.property('pagination');
      });
    language: text/javascript
order: 5000
